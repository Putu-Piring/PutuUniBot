<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFBF7"/>
      <stop offset="100%" stop-color="#F2EDE0"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <linearGradient id="greenRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="50%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>

    <linearGradient id="cakeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FDFCF7"/>
      <stop offset="100%" stop-color="#EBE3D5"/>
    </linearGradient>

    <linearGradient id="gulaMelaka" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B75C1C"/>
      <stop offset="60%" stop-color="#7B3306"/>
      <stop offset="100%" stop-color="#4A1C02"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <filter id="softGaze" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Circular Text Paths -->
    <!-- Top arc: center (300, 300), radius 228 -->
    <path id="topArc" d="M 72,300 A 228,228 0 1,1 528,300" fill="none"/>
    <!-- Bottom arc: center (300, 300), radius 232 -->
    <path id="bottomArc" d="M 532,300 A 232,232 0 0,1 68,300" fill="none"/>
  </defs>

  <!-- Outer Shadow Circle -->
  <circle cx="300" cy="300" r="280" fill="url(#greenRim)" filter="url(#dropShadow)"/>

  <!-- Outer Decorative Ring (Gold Dotted / Stitched) -->
  <circle cx="300" cy="300" r="268" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8,6"/>

  <!-- Inner Cream Disc -->
  <circle cx="300" cy="300" r="254" fill="url(#bgGrad)" stroke="#E0D7C3" stroke-width="2"/>

  <!-- Subtle Traditional Sunburst / Radial Pattern -->
  <g opacity="0.07" stroke="#3E2723" stroke-width="2">
    <circle cx="300" cy="300" r="210" fill="none"/>
    <circle cx="300" cy="300" r="160" fill="none"/>
    <circle cx="300" cy="300" r="110" fill="none"/>
    <!-- Concentric rays -->
    <line x1="300" y1="90" x2="300" y2="510"/>
    <line x1="90" y1="300" x2="510" y2="300"/>
    <line x1="151" y1="151" x2="449" y2="449"/>
    <line x1="151" y1="449" x2="449" y2="151"/>
  </g>

  <!-- Golden Ring Framing Center -->
  <circle cx="300" cy="300" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="300" cy="300" r="166" fill="#F8F4EC" stroke="#C8B89C" stroke-width="1"/>

  <!-- TOP ARCUATE TEXT: PUTU PIRING UNI -->
  <text font-family="'Segoe UI', 'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="39" fill="#1B5E20" letter-spacing="4px">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      PUTU PIRING UNI
    </textPath>
  </text>

  <!-- Flanking Star Ornaments -->
  <g fill="url(#goldGrad)">
    <!-- Left Star -->
    <polygon points="106,300 110,292 118,290 111,285 113,277 106,282 99,277 101,285 94,290 102,292"/>
    <!-- Right Star -->
    <polygon points="494,300 498,292 506,290 499,285 501,277 494,282 487,277 489,285 482,290 490,292"/>
  </g>

  <!-- Flanking Golden Paddy / Rice Sprigs -->
  <g fill="#FFA000" opacity="0.85">
    <!-- Left Spikes -->
    <ellipse cx="130" cy="250" rx="8" ry="4" transform="rotate(-30 130 250)"/>
    <ellipse cx="120" cy="275" rx="8" ry="4" transform="rotate(-15 120 275)"/>
    <ellipse cx="120" cy="325" rx="8" ry="4" transform="rotate(15 120 325)"/>
    <ellipse cx="130" cy="350" rx="8" ry="4" transform="rotate(30 130 350)"/>
    <!-- Right Spikes -->
    <ellipse cx="470" cy="250" rx="8" ry="4" transform="rotate(30 470 250)"/>
    <ellipse cx="480" cy="275" rx="8" ry="4" transform="rotate(15 480 275)"/>
    <ellipse cx="480" cy="325" rx="8" ry="4" transform="rotate(-15 480 325)"/>
    <ellipse cx="470" cy="350" rx="8" ry="4" transform="rotate(-30 470 350)"/>
  </g>

  <!-- ================= CENTER ARTWORK ================= -->
  <g id="cakeArtwork" transform="translate(0, 10)">
    <!-- Gentle Rising Steam Waves -->
    <g stroke="#C2B19C" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M 280,210 Q 270,185 285,165 T 280,140"/>
      <path d="M 300,205 Q 315,180 300,160 T 310,135"/>
      <path d="M 320,212 Q 330,190 318,170 T 325,145"/>
    </g>

    <!-- Banana Leaf Base (Rhombus / Leaf Cut) -->
    <g filter="url(#dropShadow)">
      <!-- Leaf shape -->
      <polygon points="180,340 300,295 420,340 300,385" fill="url(#leafGrad)"/>
      <!-- Leaf Veins -->
      <line x1="180" y1="340" x2="420" y2="340" stroke="#7CB342" stroke-width="2" opacity="0.6"/>
      <g stroke="#689F38" stroke-width="1.5" opacity="0.7">
        <line x1="210" y1="328" x2="230" y2="352"/>
        <line x1="250" y1="314" x2="270" y2="366"/>
        <line x1="290" y1="299" x2="310" y2="381"/>
        <line x1="330" y1="306" x2="350" y2="374"/>
        <line x1="370" y1="321" x2="390" y2="359"/>
      </g>
    </g>

    <!-- Putu Piring Steamed Rice Flour Dome -->
    <!-- Shadow under cake -->
    <ellipse cx="300" cy="342" rx="92" ry="32" fill="#0E2812" opacity="0.25"/>

    <!-- Cake Body (Soft Round Steamed Disc) -->
    <path d="M 210,335 C 210,290 245,235 300,235 C 355,235 390,290 390,335 C 390,358 350,366 300,366 C 250,366 210,358 210,335 Z" fill="url(#cakeGrad)"/>
    <ellipse cx="300" cy="336" rx="90" ry="28" fill="#F4EDE2" opacity="0.6"/>

    <!-- Texture on Rice Flour -->
    <g fill="#E0D2C0" opacity="0.6">
      <circle cx="240" cy="330" r="2"/>
      <circle cx="260" cy="315" r="2.5"/>
      <circle cx="340" cy="320" r="2"/>
      <circle cx="360" cy="335" r="2.5"/>
      <circle cx="280" cy="345" r="1.5"/>
      <circle cx="320" cy="345" r="1.5"/>
    </g>

    <!-- Molten Gula Melaka (Palm Sugar Ooze Core) -->
    <g filter="url(#dropShadow)">
      <!-- Molten Flow Cavity -->
      <path d="M 270,305 C 280,295 320,295 330,305 C 342,320 338,348 322,354 C 305,358 295,358 278,354 C 262,348 258,320 270,305 Z" fill="url(#gulaMelaka)"/>
      <!-- Molten Drips running down -->
      <path d="M 292,345 Q 295,368 298,370 Q 301,368 304,345 Z" fill="#6B2902"/>
      <path d="M 314,340 Q 318,362 322,364 Q 325,362 326,340 Z" fill="#6B2902"/>
      <!-- Glistening Syrup Highlight -->
      <path d="M 285,310 Q 300,302 315,310" stroke="#E67E22" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
      <ellipse cx="295" cy="325" rx="14" ry="6" fill="#F39C12" opacity="0.4"/>
    </g>

    <!-- Freshly Grated White Coconut Shavings (Snowy flakes on top) -->
    <g fill="#FFFFFF" stroke="#ECEFF1" stroke-width="0.8">
      <!-- Cluster on top -->
      <ellipse cx="300" cy="245" rx="35" ry="14" fill="#FFFFFF"/>
      <!-- Individual fluffy shavings -->
      <path d="M 275,240 Q 285,236 295,242"/>
      <path d="M 290,238 Q 300,232 312,238"/>
      <path d="M 305,240 Q 318,236 325,244"/>
      <path d="M 282,246 Q 296,242 308,248"/>
      <path d="M 295,250 Q 305,246 318,252"/>
      <!-- Strays on side of dome -->
      <rect x="250" y="278" width="8" height="3" rx="1.5" fill="#FFF" transform="rotate(25 250 278)"/>
      <rect x="345" y="275" width="8" height="3" rx="1.5" fill="#FFF" transform="rotate(-30 345 275)"/>
      <rect x="268" y="292" width="7" height="2.5" rx="1" fill="#FFF" transform="rotate(15 268 292)"/>
      <rect x="330" y="295" width="7" height="2.5" rx="1" fill="#FFF" transform="rotate(-20 330 295)"/>
    </g>
  </g>

  <!-- ================= BOTTOM RIBBON & BANNER ================= -->
  <g id="bottomRibbon">
    <!-- Ribbon Tail Left -->
    <polygon points="120,490 155,450 155,510 120,530" fill="#144A17"/>
    <!-- Ribbon Tail Right -->
    <polygon points="480,490 445,450 445,510 480,530" fill="#144A17"/>

    <!-- Ribbon Main Body -->
    <path d="M 140,460 L 460,460 L 440,515 L 160,515 Z" fill="url(#greenRim)" filter="url(#dropShadow)"/>
    <path d="M 140,460 L 460,460 L 440,515 L 160,515 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

    <!-- Bottom Ribbon Tagline -->
    <text x="300" y="498" font-family="'Segoe UI', 'Montserrat', sans-serif" font-weight="800" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="3px">
      PANAS &amp; LEMBUT
    </text>
  </g>

  <!-- BOTTOM ARCUATE TEXT: WARISAN RASA ASLI • ENT300 UiTM -->
  <text font-family="'Segoe UI', 'Arial', sans-serif" font-weight="700" font-size="19" fill="#2E7D32" letter-spacing="3.5px">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
      WARISAN RASA ASLI • ENT300 UiTM
    </textPath>
  </text>
</svg>
